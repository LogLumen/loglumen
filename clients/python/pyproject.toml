[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "loglumen"
dynamic = ["version"]
description = "Lightweight metrics logging client for LogLumen"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "loglumen._loglumen"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "maturin>=1.15.0",
    "ruff>=0.17.3",
]
